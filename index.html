<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0C2338" />
  <title>KUDOS | CHF Human Performance</title>
  <link rel="manifest" href="manifest.webmanifest?v=hex-token-1" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v3.png" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="kudos-icon.svg?v=hex-token-1" />
  <link rel="shortcut icon" href="favicon.ico?v=hex-token-1" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v3.png" />
  <link rel="stylesheet" href="styles.css?v=weekly-engagement-nav-1" />

  <style>
    .netlify-static-form{display:none!important}
    #kudos-install-prompt{
      position:fixed;left:16px;right:16px;bottom:86px;z-index:9999;
      max-width:520px;margin:0 auto;padding:14px 16px;border-radius:16px;
      background:#0C2338;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.22);
      display:none;align-items:center;justify-content:space-between;gap:12px
    }
    #kudos-install-prompt strong{display:block}
    #kudos-install-prompt small{display:block;opacity:.82;margin-top:3px;line-height:1.35}
    #kudos-install-prompt .install-actions{display:flex;gap:8px;align-items:center}
    #kudos-install-prompt button{
      border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:800;
      background:#fff;color:#0C2338;white-space:nowrap
    }
    #kudos-install-prompt button.install-dismiss{
      background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)
    }
    #kudos-notification-optin{
      position:fixed;left:16px;right:16px;bottom:86px;z-index:10000;
      max-width:560px;margin:0 auto;padding:16px;border-radius:16px;
      background:#fff;color:#0C2338;box-shadow:0 12px 34px rgba(0,0,0,.24);
      border:1px solid rgba(12,35,56,.12)
    }
    #kudos-notification-optin strong{display:block;font-size:1rem}
    #kudos-notification-optin span{display:block;margin-top:5px;line-height:1.35;opacity:.78}
    #kudos-notification-optin-actions,.kudos-notification-optin-actions{
      display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px
    }
    #kudos-notification-optin .btn{margin:0}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="kudos-install-prompt" role="region" aria-label="Install KUDOS">
    <div>
      <strong id="kudos-install-title">Install KUDOS</strong>
      <small id="kudos-install-copy">Add the app to your phone for quicker access.</small>
    </div>
    <div class="install-actions">
      <button type="button" class="install-dismiss" id="kudos-install-dismiss">Not now</button>
      <button type="button" id="kudos-install-button">Install</button>
    </div>
  </div>

  <form name="kudos-safety" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" class="netlify-static-form" style="display:none!important" aria-hidden="true">
    <input type="hidden" name="form-name" value="kudos-safety">
    <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
    <input name="submitted_by"><input name="submitter_profile_code"><input name="submitter_profile_id"><input name="submitter_team"><input name="submission_date"><input name="category"><textarea name="description"></textarea><input name="external_reference"><input name="site_url">
  </form>

  <form name="kudos-recognition" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" class="netlify-static-form" style="display:none!important" aria-hidden="true">
    <input type="hidden" name="form-name" value="kudos-recognition">
    <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
    <input name="submitted_by"><input name="submitter_profile_code"><input name="submitter_profile_id"><input name="submitter_team"><input name="submission_date"><input name="nominated_person"><textarea name="reason"></textarea><input name="site_url">
  </form>

  <form name="kudos-innovation" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" class="netlify-static-form" style="display:none!important" aria-hidden="true">
    <input type="hidden" name="form-name" value="kudos-innovation">
    <input type="hidden" name="subject" data-remove-prefix>
    <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
    <input name="submitted_by"><input name="submitter_profile_code"><input name="submitter_profile_id"><input name="submitter_team"><input name="submission_date"><input name="category"><input name="title"><textarea name="description"></textarea><input name="site_url">
  </form>

  <form name="kudos-contributions" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" class="netlify-static-form" style="display:none!important" aria-hidden="true">
    <input type="hidden" name="form-name" value="kudos-contributions">
    <input type="text" name="bot-field" tabindex="-1" autocomplete="off">
    <input name="report_type"><input name="submitted_by"><input name="submitter_profile_code"><input name="submitter_profile_id"><input name="submitter_team"><input name="submission_date"><input name="subject"><textarea name="details"></textarea><input name="site_url">
  </form>

  <script src="config.js?v=live-startup-20261106"></script>
  <script>
    const cfg = window.KUDOS_CONFIG || {};

    async function loadKudosApp() {
      await import('./workspace-preview.js?v=nsn-preview-4');
      const previewHandled = typeof window.KUDOS_WORKSPACE_PREVIEW === 'function'
        ? await window.KUDOS_WORKSPACE_PREVIEW()
        : false;
      if (previewHandled) return;

      await import('./app.js?v=verified-notifications-20261106');
      await import('./profile-team-first.js?v=team-first-1');
      await import('./home-challenges.js?v=home-all-1');
      await import('./challenge-teams.js?v=team-selector-2');
      await import('./rep-admin.js?v=full-html-emails-20261106');
      await import('./push-notifications.js?v=push-onboarding-3');
    }

    let kudosInstallEvent = null;

    const installPrompt = () => document.getElementById('kudos-install-prompt');
    const isStandalone = () =>
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    const isIOS = () =>
      /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const hideInstallPrompt = () => {
      const prompt = installPrompt();
      if (prompt) prompt.style.display = 'none';
    };

    const showIOSInstallPrompt = () => {
      if (!isIOS() || isStandalone()) return;

      const dismissedAt = Number(localStorage.getItem('kudos_ios_install_dismissed') || 0);
      const sevenDays = 7 * 24 * 60 * 60 * 1000;
      if (dismissedAt && Date.now() - dismissedAt < sevenDays) return;

      const prompt = installPrompt();
      const title = document.getElementById('kudos-install-title');
      const copy = document.getElementById('kudos-install-copy');
      const button = document.getElementById('kudos-install-button');
      if (!prompt || !title || !copy || !button) return;

      title.textContent = 'Add KUDOS to your Home Screen';
      copy.textContent = 'On iPhone: tap Share, choose “Add to Home Screen”, then tap Add.';
      button.textContent = 'Got it';
      button.dataset.installMode = 'ios';
      prompt.style.display = 'flex';
    };

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      kudosInstallEvent = event;
      const prompt = installPrompt();
      const title = document.getElementById('kudos-install-title');
      const copy = document.getElementById('kudos-install-copy');
      const button = document.getElementById('kudos-install-button');

      if (prompt && title && copy && button && !isStandalone()) {
        title.textContent = 'Install KUDOS';
        copy.textContent = 'Add the app to your phone for quicker access.';
        button.textContent = 'Install';
        button.dataset.installMode = 'native';
        prompt.style.display = 'flex';
      }
    });

    window.addEventListener('appinstalled', () => {
      kudosInstallEvent = null;
      hideInstallPrompt();
    });

    window.addEventListener('load', () => {
      setTimeout(showIOSInstallPrompt, 1200);
    });

    document.addEventListener('click', async event => {
      if (event.target?.id === 'kudos-install-dismiss') {
        if (isIOS()) localStorage.setItem('kudos_ios_install_dismissed', String(Date.now()));
        hideInstallPrompt();
        return;
      }

      if (event.target?.id !== 'kudos-install-button') return;

      if (event.target.dataset.installMode === 'ios') {
        localStorage.setItem('kudos_ios_install_dismissed', String(Date.now()));
        hideInstallPrompt();
        return;
      }

      if (!kudosInstallEvent) return;
      const promptEvent = kudosInstallEvent;
      kudosInstallEvent = null;
      await promptEvent.prompt();
      await promptEvent.userChoice;
      hideInstallPrompt();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js?v=live-only-20261106', { scope: './', updateViaCache: 'none' })
          .catch(err => console.error('KUDOS service worker registration failed', err));
      });
    }

    // Production KUDOS must never silently enter the obsolete sample/demo mode.
    // If config.js or the external SDK fails to load, explain and offer a retry.
    function kudosStartupError(message) {
      const app = document.getElementById('app');
      if (!app) return;
      const safeMessage = String(message || 'The live connection is unavailable.');
      app.innerHTML = '';
      const panel = document.createElement('section');
      panel.style.cssText = 'max-width:660px;margin:12vh auto;padding:28px;border-radius:18px;background:#0c2338;color:#fff;font:16px/1.55 system-ui,sans-serif';
      const heading = document.createElement('h1');
      heading.textContent = 'KUDOS live connection unavailable';
      const description = document.createElement('p');
      description.textContent = safeMessage + ' Your KUDOS records have not been replaced by demo data.';
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.textContent = 'Retry live KUDOS';
      retry.style.cssText = 'padding:12px 18px;border:0;border-radius:10px;background:#d8c18c;color:#0c2338;font-weight:800;cursor:pointer';
      retry.addEventListener('click', () => window.location.reload());
      panel.append(heading, description, retry);
      app.appendChild(panel);
      console.error('KUDOS startup:', safeMessage);
    }

    const readyConfig = Boolean(cfg.SUPABASE_URL && (cfg.SUPABASE_PUBLISHABLE_KEY || cfg.SUPABASE_ANON_KEY));
    if (!readyConfig) {
      kudosStartupError('The connection settings could not be loaded. Check your connection, then retry.');
    } else {
      const sdkSources = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
        'https://unpkg.com/@supabase/supabase-js@2'
      ];
      function loadSdk(attempt = 0) {
        if (window.supabase?.createClient) {
          loadKudosApp().catch(error => kudosStartupError('The application could not start: ' + (error.message || error)));
          return;
        }
        if (attempt >= sdkSources.length) {
          kudosStartupError('The live sign-in service is not available. Please check your network connection and retry.');
          return;
        }
        const script = document.createElement('script');
        script.src = sdkSources[attempt];
        script.async = true;
        script.onload = () => loadSdk(attempt + 1);
        // loadSdk retries only when the SDK is missing, and starts the app
        // immediately if the SDK registered the expected global.
        script.onerror = () => loadSdk(attempt + 1);
        document.head.appendChild(script);
      }
      loadSdk();
    }
  </script>
</body>
</html>
